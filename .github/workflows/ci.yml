name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x logflare,vector,studio,imgproxy,edge-runtime

      - name: Database tests
        run: supabase test db

      - name: Database lint
        run: supabase db lint --level warning --fail-on warning
